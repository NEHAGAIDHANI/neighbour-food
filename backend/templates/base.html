<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}NeighbourFood{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light food-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index_page') }}">
            🍲 NeighbourFood
        </a>

        <div class="ms-auto d-flex gap-2">
            <a href="{{ url_for('about') }}" class="btn btn-outline-secondary nav-btn">
                About Us
            </a>

            <a href="{{ url_for('logout') }}" class="btn btn-danger nav-btn">
                Logout
            </a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="text-center py-3 text-muted small">
    Made with ❤️ for neighbors
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
